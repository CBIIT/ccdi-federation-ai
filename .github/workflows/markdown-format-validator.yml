name: Markdown Format Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  markdown-lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            **/*.markdown
            !**/.git/**

  