name: Python Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        working-directory: skills/ccdi-federation-ai-copilot/scripts
        run: |
          python -m unittest -v test_ccdi_client.py test_skill_guardrails.py test_pv_mapper.py
